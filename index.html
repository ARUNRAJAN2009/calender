<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Calendar</title>
<style>
:root{--bg:#f6f7f4;--ink:#23262f;--card:#fff;--line:#dcdfe6;--accent:#e2491f}
@media (prefers-color-scheme:dark){:root{--bg:#15171c;--ink:#eceef3;--card:#1e2128;--line:#33384a;--accent:#ff7a52}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
main{width:100%;max-width:520px}
h1{margin:0 0 6px;font-size:2.2rem}
p{margin:0 0 20px;opacity:.7}
a{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;color:inherit;text-decoration:none;font-weight:700}
a span{display:block;font-weight:400;opacity:.7;margin-top:4px}
a:hover,a:focus-visible{border-color:var(--accent);outline:none}
</style>
</head>
