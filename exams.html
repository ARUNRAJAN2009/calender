<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exams and Holidays – RMD Academic Calendar 2026-27</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--surface:#fff;--ink:#23262f;--muted:#6a6f7d;--line:#dcdfe6;--omr:#e2491f;--omr-ink:#fff;--ok:#1d7a4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--surface:#1e2128;--ink:#eceef3;--muted:#9aa0b0;--line:#33384a;--omr:#ff7a52;--omr-ink:#1a0e09;--ok:#6fd49a}}
:root[data-theme="dark"]{--bg:#15171c;--surface:#1e2128;--ink:#eceef3;--muted:#9aa0b0;--line:#33384a;--omr:#ff7a52;--omr-ink:#1a0e09;--ok:#6fd49a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 14px;display:flex;justify-content:center}
.wrap{width:100%;max-width:820px}
h1{margin:0;font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin:4px 0 16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.views button{border-radius:10px;font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--omr);outline-offset:2px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px}
.hero .lab{color:var(--muted);margin:0}
.big{font-size:clamp(4.5rem,22vw,9rem);font-weight:900;line-height:.95;letter-spacing:-.05em;color:var(--omr);margin:6px 0}
.big small{font-size:.22em;font-weight:600;letter-spacing:0;color:var(--ink);margin-left:8px}
.when{font-size:1.15rem;font-weight:600;margin:0 0 4px}
.note{color:var(--muted);margin:6px 0 0;font-size:.92rem;line-height:1.45}
.bub{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.bub i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.bub i.last{background:var(--omr);border-color:var(--omr)}
.bub i.sun{border-style:dashed}
.legend{font-size:.8rem;color:var(--muted);margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.c{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.c h3{margin:0 0 6px;font-size:.95rem;font-weight:600;color:var(--muted)}
.c .n{font-size:2rem;font-weight:800;letter-spacing:-.03em}
.c .d{font-size:.9rem;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-top:12px}
.row{display:grid;grid-template-columns:130px 1fr auto;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.row:first-child{border-top:0}
.row.past{opacity:.5}
.row.sun .dt{color:var(--muted)}
.row .dt{font-weight:600;font-variant-numeric:tabular-nums}
.row .tag{font-size:.8rem;color:var(--muted)}
.chip{font-size:.8rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--bg);white-space:nowrap}
.chip.now{background:var(--omr);color:var(--omr-ink)}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 0;color:var(--muted);font-size:.92rem}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row .dt{grid-column:1/-1}}
</style>

const $=id=>document.getElementById(id);
const MS=864e5;
const pd=s=>{const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])};
const today=new Date();today.setHours(0,0,0,0);
const diff=d=>Math.round((d-today)/MS);
const fm=(d,o)=>d.toLocaleDateString("en-IN",o||{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
let track="I";
try{const t=localStorage.getItem("exam-track");if(D[t])track=t}catch(e){}
function offSet(t){const s=new Set(D[t].o);return d=>d.getDay()===0||s.has(String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"))}
function collegeDays(t,to){const off=offSet(t);let n=0;for(let d=new Date(today);d<to;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){if(!off(d))n++}return n}
function status(g){
  const s=pd(g[0]),e=pd(g[1]),a=diff(s),b=diff(e);
  if(a>0)return{t:a===1?"tomorrow":"in "+plural(a,"day"),cls:"",past:false,when:a};
  if(b>=0)return{t:a===0&&b===0?"today":"in progress",cls:"now",past:false,when:0};
  return{t:plural(-b,"day")+" ago",cls:"",past:true,when:b};
}
function range(g){
  const s=pd(g[0]),e=pd(g[1]);
  if(g[0]===g[1])return fm(s);
  return fm(s,{day:"numeric",month:"short"})+" to "+fm(e,{day:"numeric",month:"short",year:"numeric"});
}
let view="exam";
try{const v=localStorage.getItem("exam-view");if(v==="exam"||v==="hol")view=v}catch(e){}
function holRuns(t){
  const named={};D[t].g.forEach(g=>{if(g[2]==="hol")named[g[0]]=g[3]});
  const off=new Set(D[t].o),runs=[];let cur=null;
  for(let d=new Date(2026,6,1);d<=new Date(2027,5,30);d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){
    const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const mmdd=iso.slice(5,7)+iso.slice(8,10),sun=d.getDay()===0;
    if(sun||off.has(mmdd)){
      const nm=named[iso]||(sun?"Sunday":"Holiday");
      if(cur&&diff(d)-diff(cur.e)===1){cur.e=new Date(d);cur.len++;cur.n.push(nm)}
      else{cur={s:new Date(d),e:new Date(d),len:1,n:[nm]};runs.push(cur)}
    }else cur=null;
  }
  runs.forEach(r=>{const u=[...new Set(r.n)],nn=u.filter(x=>x!=="Sunday"&&x!=="Holiday");r.label=nn.length?nn.join(", "):(r.len===1?u[0]:u.join(" + "));r.named=nn.length>0});
  return runs;
}
function rstatus(r){
  const a=diff(r.s),b=diff(r.e);
  if(a>0)return{t:a===1?"tomorrow":"in "+plural(a,"day"),cls:"",past:false};
  if(b>=0)return{t:"today",cls:"now",past:false};
  return{t:plural(-b,"day")+" ago",cls:"",past:true};
}
function rrange(r){
  if(r.len===1)return fm(r.s);
  return fm(r.s,{weekday:"short",day:"numeric",month:"short"})+" to "+fm(r.e,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
}
function renderHol(){
  const R=holRuns(track),up=R.filter(r=>!rstatus(r).past),nx=up[0];
  $("hl").textContent="Next holiday";
  if(nx){
    const a=diff(nx.s),s=rstatus(nx);
    $("hn").innerHTML=s.cls==="now"?"Today":a+"<small>"+(a===1?"day":"days")+" to go</small>";
    $("hw").textContent=nx.label+(nx.len>1?" ("+nx.len+" days off)":"");
    $("hc").textContent=rrange(nx)+(nx.n.includes("Sunday")&&nx.len===1?". Sundays are holidays.":"");
    const unit=a<=60?1:7,count=Math.max(1,Math.ceil(a/unit));let h="";
    for(let i=1;i<=count;i++)h+='<i'+(i===count?' class="last"':"")+'></i>';
    $("bub").innerHTML=a>0?h:"";$("bl").textContent=a>0?"Each circle is "+(unit===1?"one day":"one week")+". The filled one is the holiday.":"";
  }else{$("hn").innerHTML="None";$("hw").textContent="No more holidays in this calendar";$("hc").textContent="";$("bub").innerHTML="";$("bl").textContent=""}
  const left=up.reduce((n,r)=>n+(diff(r.s)>=0?r.len:diff(r.e)-0+1),0);
  const lb=up.find(r=>r.len>=3);
  const mo=R.filter(r=>r.s.getMonth()===today.getMonth()&&r.s.getFullYear()===today.getFullYear()).reduce((n,r)=>n+r.len,0);
  $("cards").innerHTML=
   '<div class="c"><h3>Days off left (to Jun 2027)</h3><div class="n">'+left+'</div><div class="d">Sundays and holidays</div></div>'+
   (lb?'<div class="c"><h3>Next long break</h3><div class="n">'+lb.len+' days</div><div class="d">'+rrange(lb)+'</div></div>':"")+
   '<div class="c"><h3>Days off this month</h3><div class="n">'+mo+'</div><div class="d">'+today.toLocaleDateString("en-IN",{month:"long",year:"numeric"})+'</div></div>';
  const sp=$("sp").checked;
  const rows=R.filter(r=>sp||!rstatus(r).past);
  $("list").innerHTML=rows.map(r=>{const s=rstatus(r);
    return '<div class="row'+(s.past?" past":"")+(r.named?"":" sun")+'"><span class="dt">'+rrange(r)+'</span><span>'+r.label+(r.len>1?' <span class="tag">('+r.len+' days off)</span>':"")+'</span><span class="chip '+s.cls+'">'+s.t+'</span></div>'}).join("")||'<p class="note" style="padding:10px 0">Nothing to show.</p>';
}
function renderExam(){
  const G=D[track].g,ex=G.filter(g=>g[2]!=="hol");
  const first=ty=>{const l=ex.filter(g=>g[2]===ty);return l.find(g=>!status(g).past)||l[l.length-1]};
  let up=ex.filter(g=>g[2]==="theory"&&!status(g).past);
  let main=up[0];
  if(!main){up=ex.filter(g=>["project","model","practical"].includes(g[2])&&!status(g).past);main=up[0]}
  const lastTheory=ex.filter(g=>g[2]==="theory"&&status(g).past).pop();
  if(main){
    const s=status(main),n=diff(pd(main[0]));
    $("hl").textContent=main[2]==="theory"?"Theory exams start":main[3]+" starts";
    if(s.cls==="now"){$("hn").innerHTML="Now";$("hw").textContent=range(main)}
    else{$("hn").innerHTML=n+"<small>"+(n===1?"day":"days")+" left</small>";$("hw").textContent=fm(pd(main[0]),{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
    const cd=collegeDays(track,pd(main[0]));
    let note=s.cls==="now"?"":"About "+cd+" of these are college days (not Sundays or holidays). ";
    if(lastTheory&&main[2]==="theory")note+="This semester's theory exams began on "+fm(pd(lastTheory[0]),{day:"numeric",month:"short"})+" ("+plural(-diff(pd(lastTheory[0])),"day")+" ago). The calendar gives only start dates, not the end date.";
    if(main[2]!=="theory")note+="No more theory exams are listed for this year, only project work.";
    $("hc").textContent=note;
    const unit=n<=60?1:7,count=Math.max(1,Math.ceil(n/unit));let h="";
    for(let i=1;i<=count;i++)h+='<i'+(i===count?' class="last"':"")+'></i>';
    $("bub").innerHTML=n>0?h:"";
    $("bl").textContent=n>0?"Each circle is "+(unit===1?"one day":"one week")+". The filled one is exam day.":"";
  }else{$("hl").textContent="Exams";$("hn").innerHTML="Done";$("hw").textContent="No upcoming exams in this calendar";$("hc").textContent="";$("bub").innerHTML="";$("bl").textContent=""}
  const cards=[["model","Model exam"],["practical","Practical exams start"],["theory","Theory exams start"]];
  $("cards").innerHTML=cards.map(c=>{const g=first(c[0]);if(!g)return"";const s=status(g);
    const big=s.past?plural(-diff(pd(g[1])),"day")+" ago":s.cls==="now"?"In progress":diff(pd(g[0]))+" days";
    return '<div class="c"><h3>'+c[1]+'</h3><div class="n">'+big+'</div><div class="d">'+range(g)+'</div></div>'}).join("");
  const sp=$("sp").checked;
  const rows=ex.filter(g=>sp||!status(g).past).sort((a,b)=>a[0]<b[0]?-1:1);
  $("list").innerHTML=rows.length?rows.map(g=>{const s=status(g);
    return '<div class="row'+(s.past?" past":"")+'"><span class="dt">'+range(g)+'</span><span>'+g[3]+(g[4]>1?' <span class="tag">('+g[4]+(g[2]==="project"?" days":" papers")+')</span>':"")+'</span><span class="chip '+s.cls+'">'+s.t+'</span></div>'}).join(""):'<p class="note" style="padding:10px 0">Nothing to show. Turn on "Show past".</p>';
}
function render(){
  document.querySelectorAll(".tabs button[data-t]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===track));
  document.querySelectorAll(".views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===view));
  $("ttl").textContent=view==="exam"?"Exam countdown":"Holidays";
  view==="exam"?renderExam():renderHol();
}
document.querySelectorAll(".tabs button[data-t]").forEach(b=>b.onclick=()=>{track=b.dataset.t;try{localStorage.setItem("exam-track",track)}catch(e){}render()});
document.querySelectorAll(".views button").forEach(b=>b.onclick=()=>{view=b.dataset.v;try{localStorage.setItem("exam-view",view)}catch(e){}render()});
$("sp").onchange=render;
render();
</script>
</body>
</html>
